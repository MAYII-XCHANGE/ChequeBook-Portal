services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chequebook_portal
      POSTGRES_USER: cheque_portal
      POSTGRES_PASSWORD: cheque_portal
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cheque_portal -d chequebook_portal"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - chequebook-postgres:/var/lib/postgresql/data

volumes:
  chequebook-postgres:
